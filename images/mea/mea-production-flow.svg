<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized MEA production flow</title><desc id="desc">Restaurant inputs flow through validation, normalization, decision logic, scheduled outputs, and retained run evidence.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.a{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.o{fill:#ecfdf5;stroke:#047857;stroke-width:2}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none}.h{font:700 22px system-ui;fill:#0f172a}.t{font:17px system-ui;fill:#334155}.s{font:16px system-ui;fill:#475569}.cap{font:700 17px system-ui;fill:#0369a1}.title{font:700 30px system-ui;fill:#0f172a}</style></defs>
  <rect class="bg" width="1400" height="520" rx="24"/><text class="title" x="700" y="55" text-anchor="middle">Production information flow</text><text class="s" x="700" y="85" text-anchor="middle">Sanitized architecture — names, vendors, credentials, and business rules omitted</text>
  <rect class="b" x="45" y="150" width="230" height="190" rx="18"/><text class="h" x="160" y="190" text-anchor="middle">Operational inputs</text><text class="t" x="75" y="230">• Sales and labor reports</text><text class="t" x="75" y="262">• Invoices and purchasing</text><text class="t" x="75" y="294">• Schedules and records</text><path class="l" d="M275 245H340"/>
  <rect class="a" x="340" y="150" width="230" height="190" rx="18"/><text class="h" x="455" y="190" text-anchor="middle">Acquire and validate</text><text class="t" x="370" y="230">• Scheduled ingestion</text><text class="t" x="370" y="262">• Freshness and format</text><text class="t" x="370" y="294">• Explicit exceptions</text><path class="l" d="M570 245H635"/>
  <rect class="b" x="635" y="150" width="230" height="190" rx="18"/><text class="h" x="750" y="190" text-anchor="middle">Normalize and analyze</text><text class="t" x="665" y="230">• Products and units</text><text class="t" x="665" y="262">• Cost and performance</text><text class="t" x="665" y="294">• Recommendation rules</text><path class="l" d="M865 245H930"/>
  <rect class="o" x="930" y="150" width="250" height="190" rx="18"/><text class="h" x="1055" y="190" text-anchor="middle">Scheduled outputs</text><text class="t" x="960" y="230">• Daily operating briefs</text><text class="t" x="960" y="262">• Cost reporting</text><text class="t" x="960" y="294">• Order recommendations</text><path class="l" d="M1180 245H1245"/>
  <rect class="b" x="1245" y="175" width="120" height="140" rx="18"/><text class="h" x="1305" y="220" text-anchor="middle">Operators</text><text class="s" x="1305" y="255" text-anchor="middle">Review</text><text class="s" x="1305" y="280" text-anchor="middle">and act</text><path class="d" d="M1055 340V405H455V340"/><text class="cap" x="755" y="445" text-anchor="middle">RETAINED RUN EVIDENCE, LOGS, AND EXCEPTION HISTORY</text>
</svg>
