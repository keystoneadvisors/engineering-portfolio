<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">MEA operating feedback loop</title><desc id="desc">Data becomes exceptions and recommendations, managers act, and results refine the next run. Inventory implementation remains staged.</desc>
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.g{fill:#ecfdf5;stroke:#047857;stroke-width:2}.st{fill:#fff7ed;stroke:#c2410c;stroke-width:2;stroke-dasharray:8 6}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a2)}.sl{stroke:#c2410c;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#a2)}.h{font:700 22px system-ui;fill:#0f172a}.t{font:17px system-ui;fill:#334155}.s{font:16px system-ui;fill:#475569}.stage{font:700 17px system-ui;fill:#9a3412}.title{font:700 30px system-ui;fill:#0f172a}</style></defs>
  <rect class="bg" width="1400" height="650" rx="24"/><text class="title" x="700" y="55" text-anchor="middle">Operational decision and feedback loop</text><text class="s" x="700" y="85" text-anchor="middle">Working production loop with a separate staged physical-inventory extension</text>
  <rect class="b" x="70" y="170" width="220" height="135" rx="18"/><text class="h" x="180" y="215" text-anchor="middle">Source data</text><text class="t" x="180" y="250" text-anchor="middle">Scheduled inputs from</text><text class="t" x="180" y="278" text-anchor="middle">two restaurants</text><path class="l" d="M290 237H360"/>
  <rect class="b" x="360" y="170" width="220" height="135" rx="18"/><text class="h" x="470" y="215" text-anchor="middle">Detect</text><text class="t" x="470" y="250" text-anchor="middle">Missing, stale, malformed,</text><text class="t" x="470" y="278" text-anchor="middle">or relevant conditions</text><path class="l" d="M580 237H650"/>
  <rect class="g" x="650" y="170" width="220" height="135" rx="18"/><text class="h" x="760" y="215" text-anchor="middle">Recommend</text><text class="t" x="760" y="250" text-anchor="middle">Cost, purchasing, and</text><text class="t" x="760" y="278" text-anchor="middle">performance guidance</text><path class="l" d="M870 237H940"/>
  <rect class="b" x="940" y="170" width="220" height="135" rx="18"/><text class="h" x="1050" y="215" text-anchor="middle">Manager review</text><text class="t" x="1050" y="250" text-anchor="middle">Apply operating context</text><text class="t" x="1050" y="278" text-anchor="middle">and choose an action</text><path class="l" d="M1160 237H1230"/>
  <rect class="g" x="1230" y="170" width="120" height="135" rx="18"/><text class="h" x="1290" y="215" text-anchor="middle">Act</text><text class="t" x="1290" y="250" text-anchor="middle">Order</text><text class="t" x="1290" y="278" text-anchor="middle">or adjust</text><path class="l" d="M1290 305V385H1050V430"/>
  <rect class="b" x="880" y="430" width="340" height="115" rx="18"/><text class="h" x="1050" y="472" text-anchor="middle">Observe results and refine</text><text class="t" x="1050" y="505" text-anchor="middle">Compare outcomes and feedback;</text><text class="t" x="1050" y="532" text-anchor="middle">revise rules when reality differs</text><path class="l" d="M880 488H470V305"/>
  <rect class="st" x="120" y="430" width="430" height="115" rx="18"/><text class="stage" x="335" y="468" text-anchor="middle">STAGED IMPLEMENTATION</text><text class="t" x="335" y="502" text-anchor="middle">Physical inventory sheets and end-to-end</text><text class="t" x="335" y="530" text-anchor="middle">validation before production rollout</text><path class="sl" d="M335 430V360H760V305"/>
</svg>
